name: Build and deploy to Cloudflare Pages

# Vsak push na main (tudi shranjevanje iz CMS) objavi stran na gbdomzale.pages.dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
          SITE_URL: https://gbdomzale.si
      # Objava iz korena repozitorija, da wrangler pobere tudi functions/ (obrazec za prijavo).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=gbdomzale --branch=main --commit-hash=${{ github.sha }}
